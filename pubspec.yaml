name: somou
description: "Lista de compras com total na hora"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  path: ^1.9.1
  intl: ^0.20.3
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:


  uses-material-design: true
  generate: true
  assets:
    - assets/splash/logo.png



# Splash screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#1F7A45"
  color_dark: "#1A3324"
  image: assets/splash/splash.png
  android_12:
    color: "#1F7A45"
    color_dark: "#1A3324"
    image: assets/splash/splash.png
  web: false

# Ícone do app: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1F7A45"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
